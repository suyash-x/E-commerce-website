{% extends 'base.html' %}
{% load static %}
{% block xyz %}
<div class="row py-5 my-5 align-items-center justify-content-center">
<div class="col-lg-4 col-md-6 mx-auto">
<div class="card border-0 shadow-lg p-4 rounded-4 bg-white animate-fade-in">
<div class="card-body text-center">
<div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 60px; height: 60px; font-size: 1.5rem;">
<i class="fa-solid fa-key fa-bounce"></i>
</div>
<h3 class="fw-bold mb-1">Welcome <span class="text-warning bg-dark px-2 rounded">Back</span></h3>
<p class="text-muted small mb-4">Login to access your Zeva account</p>

<form method="post" class="text-start">
{% csrf_token %}
<div class="mb-3">
<label class="form-label small fw-bold">Email Address</label>
<input type="email5" required placeholder="name@example.com" name="email" class="form-control border-2 bg-light">
</div>
<div class="mb-3">
<label class="form-label small fw-bold">Password</label>
<input type="password" required placeholder="••••••••" name="password" class="form-control border-2 bg-light">
</div>
<div class="d-flex justify-content-between align-items-center mb-4">
<span class="text-muted small">Not Registered?</span>
<a href="/user/register" class="text-dark fw-bold text-decoration-none hover-coral">Register Now</a>
</div>
<button type="submit" class="btn btn-genz btn-yellow w-100 py-3 fw-bold shadow-sm">Login Now</button>
</form>

{% if msg %}
<div class="alert alert-success mt-3 mb-0 text-center fw-bold rounded-pill small">
{{ msg }}
</div>
{% endif %}
</div>
</div>
</div>
</div>
{% endblock %}
{% block services %}
{% endblock %}
